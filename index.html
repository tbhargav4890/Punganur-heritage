<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b3a"><link rel="manifest" href="manifest.json"><title>Punganur Heritage</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f7f2;color:#263426}header{background:#315b3a;color:#fff;padding:18px;position:sticky;top:0;z-index:3}h1{margin:0;font-size:22px}main{max-width:720px;margin:auto;padding:14px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}.num{font-size:28px;font-weight:700}.muted{color:#6b756b;font-size:13px}.btn{border:0;border-radius:10px;padding:12px 14px;background:#315b3a;color:#fff;font-weight:600}.btn2{border:0;border-radius:10px;padding:10px;background:#e6eee5;color:#315b3a}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:4}.nav button{flex:1;border:0;background:#fff;padding:10px 2px;font-size:11px}.nav button b{display:block;font-size:18px}.screen{display:none}.screen.on{display:block}input,select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ccd5cc;border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.animal{border-left:5px solid #315b3a}.tag{display:inline-block;background:#e8f1e8;border-radius:10px;padding:3px 7px;font-size:11px}.tree{text-align:center}.node{display:inline-block;padding:10px;background:#edf5ed;border:1px solid #b9ccb9;border-radius:12px;margin:5px}
</style></head><body><header><h1>🐄 Punganur Heritage</h1><div class="muted" style="color:#dbe8dc">Offline Punganur Cattle Records</div></header><main id="app"></main><nav class="nav">
<button onclick="go('home')"><b>🏠</b>Home</button><button onclick="go('cattle')"><b>🐄</b>Cattle</button><button onclick="go('pedigree')"><b>🌳</b>Pedigree</button><button onclick="go('breeding')"><b>❤️</b>Breeding</button><button onclick="go('lactation')"><b>🥛</b>Lactation</button></nav>
<script>
const A='ph_animals';const B='ph_breeding';const L='ph_lactation';
const get=k=>JSON.parse(localStorage.getItem(k)||'[]');const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function go(s){({home,cattle,pedigree,breeding,lactation}[s])()}
function home(){let a=get(A),f=a.filter(x=>x.sex==='Female').length,m=a.filter(x=>x.sex==='Male').length;app.innerHTML=`<h2>Farm Dashboard</h2><div class=grid><div class=card><div class=muted>Total Cattle</div><div class=num>${a.length}</div></div><div class=card><div class=muted>Cows</div><div class=num>${f}</div></div><div class=card><div class=muted>Bulls</div><div class=num>${m}</div></div><div class=card><div class=muted>Breeding Records</div><div class=num>${get(B).length}</div></div></div><div class=panel><b>Quick Add</b><p class=muted>Add each Punganur animal once. Its ID connects pedigree, breeding and lactation records.</p><button class=btn onclick="cattleForm()">➕ Add Cattle</button></div><div class=panel><b>Backup</b><p class=muted>Export all records as a JSON file and keep a copy somewhere safe.</p><button class=btn2 onclick="backup()">💾 Export Backup</button></div>`}
function cattle(){let a=get(A);app.innerHTML=`<h2>Cattle Register</h2><button class=btn onclick="cattleForm()">➕ Add Cattle</button>${a.map(x=>`<div class="card animal"><b>${x.name}</b> <span class=tag>${x.id}</span><br><span class=muted>${x.sex} • DOB ${x.dob||'—'}<br>Father: ${x.father||'Unknown'} • Mother: ${x.mother||'Unknown'}</span></div>`).join('')||'<div class=panel>No animals yet.</div>'}`}
function cattleForm(){app.innerHTML=`<h2>Add Cattle</h2><div class=panel><label>Animal ID</label><input id=id placeholder="PUN-001"><label>Name</label><input id=name placeholder="Dhruva"><div class=row><div><label>Sex</label><select id=sex><option>Female</option><option>Male</option></select></div><div><label>DOB</label><input id=dob type=date></div></div><label>Father</label><input id=father placeholder="Shankar"><label>Mother</label><input id=mother placeholder="Mother name"><label>Colour / Markings</label><input id=colour placeholder="White / red ears / etc."><button class=btn onclick="saveAnimal()">SAVE ANIMAL</button></div>`}
function saveAnimal(){let a=get(A);a.push({id:id.value||'PUN-'+String(a.length+1).padStart(3,'0'),name:name.value||'Unnamed',sex:sex.value,dob:dob.value,father:father.value,mother:mother.value,colour:colour.value});set(A,a);alert('Animal saved');cattle()}
function pedigree(){app.innerHTML=`<h2>Pedigree</h2><div class=panel><div class=tree><div class=node>Great Grandfather<br><b>Unknown</b></div><div>↓</div><div class=node>Grandfather<br><b>Shiva</b></div><div>↓</div><div class=node>Father<br><b>Shankar</b></div><div>↓</div><div class=node>Animal<br><b>Dhruva</b></div></div><p class=muted>This sample shows the intended generation view. Saved parent records are ready to be linked in the next expansion.</p></div>`}
function breeding(){app.innerHTML=`<h2>Breeding & AI</h2><div class=panel><label>Cow ID</label><input id=bcow placeholder="PUN-001"><label>Service Type</label><select id=type><option>AI</option><option>Natural Service</option></select><label>Bull / Semen Straw ID</label><input id=bull placeholder="Bull / straw number"><label>Service Date</label><input id=sd type=date><label>Pregnancy Result</label><select id=pr><option>Pending</option><option>Positive</option><option>Negative</option></select><label>Expected Calving</label><input id=ec type=date><button class=btn onclick="saveBreed()">SAVE BREEDING</button></div>`}
function saveBreed(){let b=get(B);b.push({cow:bcow.value,type:type.value,bull:bull.value,service:sd.value,pregnancy:pr.value,calving:ec.value});set(B,b);alert('Breeding record saved');home()}
function lactation(){app.innerHTML=`<h2>Lactation</h2><div class=panel><label>Cow ID</label><input id=lcow placeholder="PUN-001"><label>Lactation Number</label><input id=ln type=number min=1 placeholder="1"><label>Calving Date</label><input id=cd type=date><div class=row><div><label>Peak L/day</label><input id=peak type=number step=.1></div><div><label>Average L/day</label><input id=avg type=number step=.1></div></div><label>Dry-off Date</label><input id=dd type=date><button class=btn onclick="saveLact()">SAVE LACTATION</button></div>`}
function saveLact(){let l=get(L);l.push({cow:lcow.value,no:ln.value,calving:cd.value,peak:peak.value,avg:avg.value,dry:dd.value});set(L,l);alert('Lactation record saved');home()}
function backup(){let data={animals:get(A),breeding:get(B),lactation:get(L),exported:new Date().toISOString()};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='punganur-heritage-backup.json';a.click();URL.revokeObjectURL(u)}
home();
</script></body></html>
