<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b3a"><link rel="manifest" href="manifest.json"><title>Punganur Heritage</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f7f2;color:#243124}header{background:#315b3a;color:#fff;padding:17px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}main{max-width:760px;margin:auto;padding:14px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}.num{font-size:28px;font-weight:700}.muted{color:#6c776c;font-size:13px}.btn,.btn2{border:0;border-radius:10px;padding:11px 14px;font-weight:650}.btn{background:#315b3a;color:#fff}.btn2{background:#e5eee5;color:#315b3a}.danger{background:#f4dddd;color:#9a2727}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}.nav button{flex:1;border:0;background:#fff;padding:8px 2px;font-size:10px}.nav b{display:block;font-size:18px}.screen{display:none}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd5cc;border-radius:9px;background:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.animal{border-left:5px solid #315b3a}.tag{display:inline-block;background:#e8f1e8;border-radius:10px;padding:3px 7px;font-size:11px}.photo{width:78px;height:78px;object-fit:cover;border-radius:12px;float:right;margin-left:10px}.tree{text-align:center}.node{display:inline-block;padding:10px;background:#edf5ed;border:1px solid #b9ccb9;border-radius:12px;margin:5px;min-width:110px}</style></head><body><header><h1>🐄 Punganur Heritage</h1><div style="opacity:.85;font-size:13px">Punganur Cattle Management • V3</div></header><main id="app"></main><nav class="nav"><button onclick="home()"><b>🏠</b>Home</button><button onclick="cattle()"><b>🐄</b>Cattle</button><button onclick="pedigree()"><b>🌳</b>Pedigree</button><button onclick="breeding()"><b>❤️</b>Breeding</button><button onclick="more()"><b>☰</b>More</button></nav><script>
const K={a:'ph3_animals',b:'ph3_breeding',c:'ph3_calving',l:'ph3_lactation',h:'ph3_health'};const get=k=>JSON.parse(localStorage.getItem(k)||'[]'),set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const age=d=>{if(!d)return'—';let x=new Date(d),n=new Date(),y=n.getFullYear()-x.getFullYear();if(n.getMonth()<x.getMonth()||(n.getMonth()==x.getMonth()&&n.getDate()<x.getDate()))y--;return y+' yr'};
function home(){let a=get(K.a),f=a.filter(x=>x.sex==='Female').length,m=a.filter(x=>x.sex==='Male').length;app.innerHTML=`<h2>Farm Dashboard</h2><div class=grid><div class=card><div class=muted>Total Cattle</div><div class=num>${a.length}</div></div><div class=card><div class=muted>Cows</div><div class=num>${f}</div></div><div class=card><div class=muted>Bulls</div><div class=num>${m}</div></div><div class=card><div class=muted>Breeding</div><div class=num>${get(K.b).length}</div></div></div><div class=panel><button class=btn onclick="cattleForm()">➕ Add Cattle</button> <button class=btn2 onclick="breedingForm()">❤️ Breeding</button></div><div class=panel><b>Backup</b><p class=muted>Export regularly to protect your records.</p><button class=btn2 onclick="backup()">📤 Export Backup</button> <label class=btn2>📥 Import<input type=file accept=.json onchange="restore(event)" style="display:none"></label></div>`}
function cattle(){app.innerHTML='<h2>Cattle Register</h2><input id=q placeholder="🔎 Search cattle" oninput="renderCattle()"><button class=btn onclick="cattleForm()">➕ Add Cattle</button><div id=list></div>';renderCattle()}function renderCattle(){let q=(document.getElementById('q')?.value||'').toLowerCase(),a=get(K.a).filter(x=>JSON.stringify(x).toLowerCase().includes(q));list.innerHTML=a.map(x=>`<div class="card animal">${x.photo?`<img class=photo src="${x.photo}">`:''}<b>${esc(x.name)}</b> <span class=tag>${esc(x.id)}</span><div class=muted>${esc(x.sex)} • DOB ${esc(x.dob)||'—'} • Age ${age(x.dob)}<br>Father: ${esc(x.father)||'Unknown'} • Mother: ${esc(x.mother)||'Unknown'}<br>Colour: ${esc(x.colour)||'—'}</div><br><button class=btn2 onclick="viewAnimal('${esc(x.id)}')">View</button> <button class=btn2 onclick="editAnimal('${esc(x.id)}')">Edit</button> <button class="btn2 danger" onclick="deleteAnimal('${esc(x.id)}')">Delete</button></div>`).join('')||'<div class=panel>No cattle yet.</div>'}
function cattleForm(x){x=x||{id:'',name:'',sex:'Female',dob:'',father:'',mother:'',colour:'',status:'Active',photo:''};app.innerHTML=`<h2>${x.id?'Edit':'Add'} Cattle</h2><div class=panel><label>Animal ID</label><input id=id value="${esc(x.id)}" placeholder="PUN-001"><label>Name</label><input id=name value="${esc(x.name)}"><div class=row><div><label>Sex</label><select id=sex><option ${x.sex==='Female'?'selected':''}>Female</option><option ${x.sex==='Male'?'selected':''}>Male</option></select></div><div><label>DOB</label><input id=dob type=date value="${esc(x.dob)}"></div></div><label>Father</label><input id=father value="${esc(x.father)}"><label>Mother</label><input id=mother value="${esc(x.mother)}"><label>Colour / Markings</label><input id=colour value="${esc(x.colour)}"><label>Status</label><select id=status><option>Active</option><option>Sold</option><option>Deceased</option></select><label>Photo</label><input id=photo type=file accept=image/*><button class=btn onclick="saveAnimal('${esc(x.id)}')">SAVE ANIMAL</button> <button class=btn2 onclick="cattle()">Cancel</button></div>`}
function saveAnimal(old){let finish=p=>{let a=get(K.a),o={id:id.value.trim()||'PUN-'+String(a.length+1).padStart(3,'0'),name:name.value.trim()||'Unnamed',sex:sex.value,dob:dob.value,father:father.value.trim(),mother:mother.value.trim(),colour:colour.value.trim(),status:status.value,photo:p};let i=old?a.findIndex(x=>x.id===old):-1;if(i>=0)a[i]=o;else a.push(o);set(K.a,a);alert('Animal saved');cattle()};let f=photo.files[0];if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(get(K.a).find(x=>x.id===old)?.photo||'')}
function editAnimal(id){let x=get(K.a).find(x=>x.id===id);if(x)cattleForm(x)}function deleteAnimal(id){if(confirm('Delete this animal?')){set(K.a,get(K.a).filter(x=>x.id!==id));cattle()}}function viewAnimal(id){let x=get(K.a).find(x=>x.id===id);app.innerHTML=`<h2>${esc(x.name)} <span class=tag>${esc(x.id)}</span></h2><div class=panel>${x.photo?`<img class=photo src="${x.photo}">`:''}<b>Animal Details</b><p class=muted>Sex: ${esc(x.sex)}<br>DOB: ${esc(x.dob)||'—'} • Age: ${age(x.dob)}<br>Father: ${esc(x.father)||'Unknown'}<br>Mother: ${esc(x.mother)||'Unknown'}<br>Colour: ${esc(x.colour)||'—'}<br>Status: ${esc(x.status)}</p></div><button class=btn2 onclick="editAnimal('${esc(id)}')">Edit</button> <button class=btn2 onclick="cattle()">Back</button>`}
function pedigree(){let id=prompt('Enter Animal ID (example PUN-001)');if(!id)return home();let a=get(K.a),x=a.find(z=>z.id===id);if(!x){alert('Animal not found');return cattle()}let n=(v,l)=>{let p=a.find(z=>z.id===v||z.name===v);return `<div class=node>${l}<br><b>${esc(p?.name||v||'Unknown')}</b></div>`};app.innerHTML=`<h2>🌳 Pedigree: ${esc(x.name)}</h2><div class=panel><div class=tree>${n(x.father,'Father')} ${n(x.mother,'Mother')}<div>↓</div><div class=node>Animal<br><b>${esc(x.name)}</b></div></div><p class=muted>Register parent animals with their own parents to build deeper generations.</p></div>`}
function breeding(){app.innerHTML='<h2>❤️ Breeding & AI</h2><button class=btn onclick="breedingForm()">➕ New Record</button><div id=breeds></div>';let a=get(K.b);breeds.innerHTML=a.map(r=>`<div class=card><b>${esc(r.cow)}</b> • ${esc(r.type)}<div class=muted>Bull/Semen: ${esc(r.bull)||'—'}<br>Service: ${esc(r.service)||'—'} • Pregnancy: ${esc(r.pregnancy)}<br>Expected calving: ${esc(r.calving)||'—'}</div></div>`).join('')||'<div class=panel>No records.</div>'}function breedingForm(){app.innerHTML=`<h2>❤️ New Breeding</h2><div class=panel><label>Cow ID</label><input id=cow placeholder=PUN-001><label>Service</label><select id=type><option>AI</option><option>Natural Service</option></select><label>Bull / Semen Straw ID</label><input id=bull><label>Service Date</label><input id=service type=date><label>Pregnancy</label><select id=pregnancy><option>Pending</option><option>Positive</option><option>Negative</option></select><label>Expected Calving</label><input id=calving type=date><button class=btn onclick="saveBreed()">SAVE</button></div>`}function saveBreed(){let a=get(K.b);a.push({cow:cow.value.trim(),type:type.value,bull:bull.value.trim(),service:service.value,pregnancy:pregnancy.value,calving:calving.value});set(K.b,a);alert('Saved');breeding()}
function more(){app.innerHTML=`<h2>More Records</h2><div class=panel><button class=btn2 onclick="calvingForm()">🐣 Calving</button> <button class=btn2 onclick="lactationForm()">🥛 Lactation</button> <button class=btn2 onclick="healthForm()">💉 Health</button></div><div class=panel>Calving: ${get(K.c).length} • Lactation: ${get(K.l).length} • Health: ${get(K.h).length}</div>`}function calvingForm(){app.innerHTML=`<h2>🐣 Calving / Calf</h2><div class=panel><label>Mother ID</label><input id=mi><label>Calving Date</label><input id=dt type=date><label>Calf ID</label><input id=ci><label>Calf Name</label><input id=cn><label>Sex</label><select id=cs><option>Female</option><option>Male</option></select><label>Father / Bull</label><input id=cf><button class=btn onclick="saveCalf()">SAVE</button></div>`}function saveCalf(){let a=get(K.c);a.push({cow:mi.value,date:dt.value,calfId:ci.value,calfName:cn.value,sex:cs.value,father:cf.value});set(K.c,a);alert('Saved');more()}
function lactationForm(){app.innerHTML=`<h2>🥛 Lactation</h2><div class=panel><label>Cow ID</label><input id=lc><label>Lactation Number</label><input id=ln type=number><label>Calving Date</label><input id=ld type=date><div class=row><div><label>Peak L/day</label><input id=pk type=number step=.1></div><div><label>Average L/day</label><input id=av type=number step=.1></div></div><label>Dry-off Date</label><input id=dr type=date><button class=btn onclick="saveLact()">SAVE</button></div>`}function saveLact(){let a=get(K.l);a.push({cow:lc.value,no:ln.value,calving:ld.value,peak:pk.value,avg:av.value,dry:dr.value});set(K.l,a);alert('Saved');more()}
function healthForm(){app.innerHTML=`<h2>💉 Health</h2><div class=panel><label>Animal ID</label><input id=hi><label>Date</label><input id=hd type=date><label>Type</label><select id=ht><option>Vaccination</option><option>Deworming</option><option>Treatment</option><option>Other</option></select><label>Details</label><textarea id=tx rows=4></textarea><button class=btn onclick="saveHealth()">SAVE</button></div>`}function saveHealth(){let a=get(K.h);a.push({cow:hi.value,date:hd.value,type:ht.value,details:tx.value});set(K.h,a);alert('Saved');more()}
function backup(){let d={version:3,exported:new Date().toISOString(),animals:get(K.a),breeding:get(K.b),calving:get(K.c),lactation:get(K.l),health:get(K.h)};let u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='punganur-heritage-backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);for(let k of [['animals',K.a],['breeding',K.b],['calving',K.c],['lactation',K.l],['health',K.h]])if(d[k[0]])set(k[1],d[k[0]]);alert('Backup restored');home()}catch(_){alert('Invalid backup')}};r.readAsText(e.target.files[0])}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});home();
</script></body></html>
