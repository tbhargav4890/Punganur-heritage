<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b35"><link rel="manifest" href="manifest.json"><title>Punganur Cattles V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#1d2a20;font-family:system-ui}.top{background:linear-gradient(135deg,#254d2c,#5d8b60);color:white;padding:16px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px}.logo,.profile{width:50px;height:50px;border-radius:15px;background:white;display:grid;place-items:center;overflow:hidden;font-size:27px}.profile{border-radius:50%;margin-left:auto;border:2px solid white}.logo img,.profile img,.cowimg{width:100%;height:100%;object-fit:cover}.app{max-width:760px;margin:auto;padding-bottom:75px}.slider{margin:14px;border-radius:18px;overflow:hidden;background:#29452e;position:relative}.slides{display:flex;transition:.4s}.slide{min-width:100%;height:230px;position:relative}.slide img{width:100%;height:100%;object-fit:cover}.cap{position:absolute;bottom:0;left:0;right:0;padding:30px 14px 12px;color:white;font-weight:700;background:linear-gradient(transparent,#000b)}.content{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.tile{background:white;border:1px solid #dfe7df;border-radius:15px;padding:14px;box-shadow:0 3px 10px #0001}.tile{font:inherit;text-align:left}.tile b{display:block;margin-top:7px}.section{display:none}.section.active{display:block}.title{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:9px 12px;background:#315b35;color:#fff;font-weight:650}.btn.red{background:#b3261e}.btn.light{background:#e8efe8;color:#315b35}.small{font-size:12px;padding:7px 9px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6cc;border-radius:9px;margin-top:5px;font:inherit}label{display:block;font-size:13px;color:#68746b;margin-top:9px}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.list{display:grid;gap:9px;margin-top:10px}.animal{display:flex;gap:10px;align-items:center}.animal .cowimg{width:64px;height:64px;border-radius:12px;background:#e6eee6}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.empty{text-align:center;color:#68746b;padding:25px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}.navs{max-width:760px;margin:auto;display:flex;justify-content:space-around}.nav{border:0;background:none;padding:8px;color:#667067;font-size:12px}.nav b{display:block;font-size:20px}.nav.on{color:#315b35;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:end}.modal.on{display:flex}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo" id="logo">🐄</div><div><b style="font-size:20px">Punganur Cattles</b><small style="display:block">Custom Farm App • V2</small></div><div class="profile" id="profile">👤</div></div></header>
<div class="slider"><div class="slides" id="slides"></div></div>
<main class="content"><section id="home" class="section active"><div class="title"><h2>Home</h2><button class="btn small" onclick="photos()">📷 Photos</button></div><div class="grid"><button class="tile" onclick="cattleForm()">🐄<b>Add Cattle</b></button><button class="tile" onclick="go('cattle')">📋<b>All Cattle</b></button><button class="tile" onclick="profileForm()">👤<b>My Profile</b></button><button class="tile" onclick="backup()">💾<b>Backup</b></button></div><h3>Farm Summary</h3><div class="grid"><div class="card">🐄 <b id="cc">0</b><small> Cattle</small></div><div class="card">🧬 <b id="bc">0</b><small> Breeding</small></div><div class="card">🐮 <b id="kc">0</b><small> Calves</small></div><div class="card">🥛 <b id="lc">0</b><small> Lactation</small></div></div></section>
<section id="cattle" class="section"><div class="title"><h2>Cattle Register</h2><button class="btn small" onclick="cattleForm()">＋ Add</button></div><input id="search" placeholder="Search ID, name, breed" oninput="render()"><div id="list" class="list"></div></section>
<section id="animal" class="section"><div class="title"><button class="btn light small" onclick="go('cattle')">← Back</button><h2 id="at"></h2></div><div id="animalBody"></div></section>
<section id="records" class="section"><h2>Records</h2><div class="grid"><button class="tile" onclick="record('breeding')">🧬<b>Breeding</b></button><button class="tile" onclick="record('calving')">🐮<b>Calves / Calving</b></button><button class="tile" onclick="record('lactation')">🥛<b>Lactation</b></button><button class="tile" onclick="record('health')">🩺<b>Health</b></button><button class="tile" onclick="record('semen')">🧪<b>Semen</b></button><button class="tile" onclick="record('pedigree')">🌳<b>Pedigree</b></button></div><div id="rl"></div></section>
<section id="more" class="section"><h2>More</h2><div class="grid"><button class="tile" onclick="backup()">💾<b>Export Backup</b></button><button class="tile" onclick="document.getElementById('restore').click()">📥<b>Restore Backup</b></button><button class="tile" onclick="profileForm()">👤<b>Profile</b></button><button class="tile" onclick="photos()">🖼️<b>Manage Photos</b></button></div><p style="color:#68746b">V2 keeps data locally. Each record has independent Edit/Save/Delete controls and unique Animal IDs prevent duplicates.</p></section></main></div>
<nav class="bottom"><div class="navs"><button class="nav on" onclick="go('home',this)"><b>🏠</b>Home</button><button class="nav" onclick="go('cattle',this)"><b>🐄</b>Cattle</button><button class="nav" onclick="go('records',this)"><b>📋</b>Records</button><button class="nav" onclick="go('more',this)"><b>☰</b>More</button></div></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><input id="restore" type="file" accept=".json" hidden onchange="restore(this.files[0])">
<script>
const K='punganur_cattles_v2';let D=JSON.parse(localStorage.getItem(K)||'null')||{cattle:[],breeding:[],calving:[],lactation:[],health:[],semen:[],pedigree:[],photos:[],profile:'',logo:''};let timer,slide=0;
const save=()=>{localStorage.setItem(K,JSON.stringify(D));refresh()};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const el=id=>document.getElementById(id);
function go(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');if(id==='cattle')render()}
function modal(s){el('sheet').innerHTML=s;el('modal').classList.add('on')}function close(){el('modal').classList.remove('on')}el('modal').onclick=e=>{if(e.target.id==='modal')close()};
function cattleForm(id=''){let c=D.cattle.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'Add'} Cattle</h2><label>Animal ID*<input id=a value="${esc(c.id||'')}" ${id?'readonly':''}></label><label>Name<input id=n value="${esc(c.name||'')}"></label><label>Sex<select id=s><option>Cow</option><option>Bull</option><option>Calf</option></select></label><label>Breed<input id=b value="${esc(c.breed||'Punganur')}"></label><label>DOB<input id=d type=date value="${esc(c.dob||'')}"></label><label>Mother ID<input id=m value="${esc(c.mother||'')}"></label><label>Father/Bull ID<input id=f value="${esc(c.father||'')}"></label><label>Notes<textarea id=t>${esc(c.notes||'')}</textarea><div class=actions><button class=btn onclick="saveC('${esc(id)}')">💾 Save/Update</button><button class="btn light" onclick=close()>Cancel</button>${id?`<button class="btn red" onclick="delC('${esc(id)}')">🗑 Delete</button>`:''}</div>`)}
function saveC(old){let id=el('a').value.trim();if(!id)return alert('Animal ID is required');if(!old&&D.cattle.some(x=>x.id===id))return alert('Duplicate Animal ID is not allowed');let x={id,name:el('n').value,sex:el('s').value,breed:el('b').value,dob:el('d').value,mother:el('m').value,father:el('f').value,notes:el('t').value,photo:(D.cattle.find(x=>x.id===old)||{}).photo||''};if(old)D.cattle[D.cattle.findIndex(x=>x.id===old)]=x;else D.cattle.push(x);close();save()}
function delC(id){if(confirm('Delete this cattle record?')){D.cattle=D.cattle.filter(x=>x.id!==id);save();close()}}
function render(){let q=(el('search')?.value||'').toLowerCase(),a=D.cattle.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));el('list').innerHTML=a.length?a.map(c=>`<div class="card animal"><img class="cowimg" src="${c.photo||''}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23e6eee6%22/><text x=%2250%%22 y=%2260%%22 text-anchor=%22middle%22 font-size=%2230%22>🐄</text></svg>'"><div style="flex:1"><b>${esc(c.name||'Unnamed')} (${esc(c.id)})</b><small style="display:block;color:#68746b">${esc(c.sex)} • ${esc(c.breed)} • ${esc(c.dob||'-')}</small><div class=actions><button class="btn small" onclick="animal('${esc(c.id)}')">View all records</button><button class="btn light small" onclick="cattleForm('${esc(c.id)}')">Edit</button></div></div></div>`).join(''):'<div class=empty>No cattle yet. Tap Add.</div>'}
function animal(id){let c=D.cattle.find(x=>x.id===id);go('animal');el('at').textContent=c.name||c.id;el('animalBody').innerHTML=`<div class=card><div class=animal><img class=cowimg src="${c.photo||''}"><div><b>${esc(c.name||'Unnamed')}</b><small style="display:block">ID: ${esc(c.id)}<br>${esc(c.sex)} • ${esc(c.breed)}</small></div></div><div class=actions><button class="btn light small" onclick="cattleForm('${esc(id)}')">✏️ Edit</button><button class="btn small" onclick="cowPhoto('${esc(id)}')">📷 Photo</button></div></div>`+['breeding','calving','lactation','health','semen','pedigree'].map(k=>`<div class=card style="margin-top:9px"><b>${k[0].toUpperCase()+k.slice(1)}</b><small style="display:block;color:#68746b">${D[k].filter(r=>r.cattleId===id).length} linked records</small><button class="btn light small" onclick="record('${k}','${esc(id)}')">Open</button></div>`).join('')}
function cowPhoto(id){modal(`<h2>Add Cow Picture</h2><input type=file accept="image/*" onchange="setCow('${esc(id)}',this.files[0])"><p style="color:#68746b">Use a clear photo from your phone.</p>`)}function setCow(id,file){if(!file)return;let r=new FileReader;r.onload=()=>{D.cattle.find(x=>x.id===id).photo=r.result;save();close();animal(id)};r.readAsDataURL(file)}
function record(k,cid=''){let L={breeding:'Breeding',calving:'Calves / Calving',lactation:'Lactation',health:'Health',semen:'Semen Bank',pedigree:'Pedigree'};go('records');el('rl').innerHTML=`<div class=title><h3>${L[k]}</h3><button class=btn small onclick="rform('${k}','${esc(cid)}')">＋ Add</button></div><div class=list>${D[k].filter(r=>!cid||r.cattleId===cid).map(r=>`<div class=card><b>${esc(r.title||'Record')}</b><small style="display:block;color:#68746b">Animal: ${esc(r.cattleId)}<br>${esc(r.details)}</small><div class=actions><button class="btn light small" onclick="rform('${k}','${esc(r.cattleId)}','${esc(r.id)}')">Edit</button><button class="btn red small" onclick="delR('${k}','${esc(r.id)}')">Delete</button></div></div>`).join('')||'<div class=empty>No records.</div>'}</div>`}
function rform(k,cid='',id=''){let r=D[k].find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'Add'} Record</h2><label>Animal ID*<input id=rc value="${esc(r.cattleId||cid)}"></label><label>Title / Date<input id=rt value="${esc(r.title||'')}"></label><label>Details<textarea id=rd>${esc(r.details||'')}</textarea></label><div class=actions><button class=btn onclick="saveR('${k}','${esc(id)}')">💾 Save/Update</button><button class="btn light" onclick=close()>Cancel</button>${id?`<button class="btn red" onclick="delR('${esc(k)}','${esc(id)}');close()">🗑 Delete</button>`:''}</div>`)}
function saveR(k,id){let cid=el('rc').value.trim();if(!D.cattle.some(c=>c.id===cid))return alert('Animal ID not found');let r={id:id||crypto.randomUUID(),cattleId:cid,title:el('rt').value,details:el('rd').value};if(id)D[k][D[k].findIndex(x=>x.id===id)]=r;else D[k].push(r);close();save();record(k,cid)}
function delR(k,id){if(confirm('Delete this record?')){D[k]=D[k].filter(x=>x.id!==id);save()}}
function photos(){modal(`<h2>Home Cow/Bull Photos</h2><p style="color:#68746b">Add multiple pictures. They will slide automatically on the home page.</p><input type=file accept="image/*" multiple onchange="addPhotos(this.files)"><div class=photos style="margin-top:10px">${D.photos.map((p,i)=>`<div><img src="${p}"><button class="btn red small" onclick="D.photos.splice(${i},1);save();photos()">Delete</button></div>`).join('')}</div><div class=actions><button class="btn light" onclick=close()>Done</button></div>`)}function addPhotos(fs){let n=fs.length,i=0;[...fs].forEach(f=>{let r=new FileReader;r.onload=()=>{D.photos.push(r.result);if(++i===n){save();photos()}};r.readAsDataURL(f)})}
function slider(){let imgs=D.photos.length?D.photos:['data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22800%22 height=%22450%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23315b35%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>Punganur Cattles</text></svg>'];el('slides').innerHTML=imgs.map(p=>`<div class=slide><img src="${p}"><div class=cap>Punganur Cattles</div></div>`).join('');slide=0;clearInterval(timer);timer=setInterval(()=>{slide=(slide+1)%imgs.length;el('slides').style.transform=`translateX(-${slide*100}%)`},3500)}
function profileForm(){modal(`<h2>My Profile & Logo</h2><label>Profile picture<input type=file accept="image/*" onchange="setP(this.files[0])"></label>${D.profile?`<img src="${D.profile}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;margin-top:8px">`:''}<label>App logo<input type=file accept="image/*" onchange="setL(this.files[0])"></label><button class="btn light" onclick=close()>Done</button>`)}function setP(f){let r=new FileReader;r.onload=()=>{D.profile=r.result;save();profileForm()};r.readAsDataURL(f)}function setL(f){let r=new FileReader;r.onload=()=>{D.logo=r.result;save();profileForm()};r.readAsDataURL(f)}
function ui(){el('profile').innerHTML=D.profile?`<img src="${D.profile}">`:'👤';el('logo').innerHTML=D.logo?`<img src="${D.logo}">`:'🐄';el('cc').textContent=D.cattle.length;el('bc').textContent=D.breeding.length;el('kc').textContent=D.calving.length;el('lc').textContent=D.lactation.length;slider();render()}
function refresh(){ui()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='Punganur_Cattles_V2_Backup.json';a.click()}function restore(f){let r=new FileReader;r.onload=()=>{try{D=JSON.parse(r.result);save();alert('Backup restored successfully');location.reload()}catch(e){alert('Invalid backup')}};r.readAsText(f)}
ui();
</script></body></html>
